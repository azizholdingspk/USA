<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>USA Work & Tax Tracker</title>
    
    <!-- PWA Manifest & App Config -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0f172a">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        slate: { 850: '#0b1329', 900: '#0f172a', 950: '#020617' }
                    }
                }
            }
        }
    </script>

    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        body {
            padding-bottom: env(safe-area-inset-bottom);
            padding-top: env(safe-area-inset-top);
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body id="app-body" class="h-full text-slate-100 flex flex-col font-sans select-none antialiased bg-slate-950">

    <!-- MAIN CONTAINER -->
    <div id="app-wrapper" class="flex-1 flex flex-col max-w-md w-full mx-auto relative overflow-hidden">
        
        <!-- HEADER -->
        <header class="px-4 py-3 flex items-center justify-between border-b border-slate-800/80 bg-slate-900/50 backdrop-blur-md sticky top-0 z-30">
            <div class="min-w-0 pr-2">
                <h1 class="text-sm font-bold tracking-tight text-white truncate flex items-center gap-1.5">
                    <span>🇺🇸</span> US Work & Net Pay Tracker
                </h1>
                <p class="text-[10px] text-slate-400 font-medium truncate">
                    Track shifts, withholding, & estimated take-home pay
                </p>
            </div>
            <div class="flex items-center gap-1.5 shrink-0">
                <button onclick="toggleSettingsModal()" title="Tax & Wage Settings" class="w-8 h-8 bg-slate-900 border border-slate-800 rounded-xl flex items-center justify-center text-slate-300 hover:text-white transition">
                    <i data-lucide="settings" class="w-4 h-4"></i>
                </button>
            </div>
        </header>

        <!-- MAIN SCROLLABLE CONTENT (WORK TAB ONLY) -->
        <main class="flex-1 overflow-y-auto p-4 space-y-4 no-scrollbar">

            <!-- TOP TAX CONTROL & LIVE SUMMARY CARD -->
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-xl space-y-3">
                <div class="flex items-center justify-between">
                    <span class="text-xs font-bold text-white flex items-center gap-1.5 uppercase tracking-wider">
                        <i data-lucide="percent" class="w-4 h-4 text-indigo-400"></i> Tax Rate & Summary
                    </span>
                    <div class="flex items-center gap-2">
                        <label for="tax-rate-input" class="text-[10px] uppercase font-bold text-slate-400">Tax Rate (%):</label>
                        <input type="number" step="0.5" min="0" max="100" id="tax-rate-input" value="15.0" oninput="updateUI()" class="w-20 bg-slate-950 border border-slate-800 rounded-xl px-2.5 py-1 text-xs font-bold text-indigo-400 text-center focus:outline-none focus:border-indigo-500">
                    </div>
                </div>

                <div class="grid grid-cols-3 gap-2 text-xs pt-1">
                    <div class="bg-slate-950 p-2.5 rounded-xl border border-slate-800/60 text-center">
                        <span class="text-[9px] text-slate-400 block uppercase font-medium">Gross Total</span>
                        <span id="summary-gross" class="text-xs sm:text-sm font-extrabold text-white">$0.00</span>
                    </div>
                    <div class="bg-slate-950 p-2.5 rounded-xl border border-slate-800/60 text-center">
                        <span class="text-[9px] text-slate-400 block uppercase font-medium">Est. Tax</span>
                        <span id="summary-tax" class="text-xs sm:text-sm font-extrabold text-rose-400">-$0.00</span>
                    </div>
                    <div class="bg-slate-950 p-2.5 rounded-xl border border-slate-800/60 text-center">
                        <span class="text-[9px] text-slate-400 block uppercase font-medium">Net Take-Home</span>
                        <span id="summary-net" class="text-xs sm:text-sm font-extrabold text-emerald-400">$0.00</span>
                    </div>
                </div>
            </div>

            <!-- WORK SHIFT ENTRY FORM CARD -->
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-xl space-y-3">
                <div class="flex justify-between items-center">
                    <h2 class="text-xs font-semibold uppercase tracking-wider text-slate-300 flex items-center gap-1.5">
                        <i data-lucide="briefcase" class="w-4 h-4 text-emerald-400"></i> Log Work Shift / Hours
                    </h2>
                </div>

                <!-- Shift Entry Form -->
                <form id="shift-form" class="space-y-3">
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-[10px] font-medium text-slate-400 uppercase mb-1">Hours Worked</label>
                            <input type="number" step="0.25" id="shift-hours" required placeholder="8.0" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-indigo-500">
                        </div>
                        <div>
                            <label class="block text-[10px] font-medium text-slate-400 uppercase mb-1">Date</label>
                            <input type="date" id="shift-date" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-indigo-500">
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-[10px] font-medium text-slate-400 uppercase mb-1">Hourly Rate ($/hr)</label>
                            <input type="number" step="0.25" id="shift-rate" required placeholder="18.00" value="18" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-indigo-500">
                        </div>
                        <div>
                            <label class="block text-[10px] font-medium text-slate-400 uppercase mb-1">Job / Employer</label>
                            <input type="text" id="shift-job" placeholder="e.g. Main Job, Freelance" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white placeholder-slate-600 focus:outline-none focus:border-indigo-500">
                        </div>
                    </div>
                    <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-3 rounded-xl transition text-xs shadow-lg shadow-indigo-600/20">
                        Save Work Shift Entry
                    </button>
                </form>
            </div>

            <!-- WORK SHIFTS HISTORY & PAYOUTS -->
            <div class="space-y-3">
                <div class="flex justify-between items-center text-xs px-1">
                    <span class="font-bold text-slate-300 uppercase tracking-wider">Work Shifts History & Payouts</span>
                    <span id="pending-earnings-total" class="text-emerald-400 font-semibold">$0.00 Gross</span>
                </div>
                <div id="shifts-list" class="space-y-2">
                    <div class="text-slate-500 text-center py-6 text-xs bg-slate-900 border border-slate-800 rounded-2xl">
                        No work shifts logged yet.
                    </div>
                </div>
            </div>

        </main>
    </div>

    <!-- APP LOGIC -->
    <script>
        const STORAGE_KEY_SHIFTS = 'us_work_tracker_shifts';
        const STORAGE_KEY_TAX_RATE = 'us_work_tracker_tax_rate';

        let shiftEntries = [];

        window.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
            
            const savedTax = localStorage.getItem(STORAGE_KEY_TAX_RATE);
            if (savedTax !== null) {
                document.getElementById('tax-rate-input').value = savedTax;
            }

            const todayStr = new Date().toISOString().split('T')[0];
            document.getElementById('shift-date').value = todayStr;
            
            loadShifts();
        });

        function loadShifts() {
            const saved = localStorage.getItem(STORAGE_KEY_SHIFTS);
            if (saved) {
                try {
                    shiftEntries = JSON.parse(saved);
                } catch (e) {
                    shiftEntries = [];
                }
            }
            updateUI();
        }

        function saveShifts() {
            localStorage.setItem(STORAGE_KEY_SHIFTS, JSON.stringify(shiftEntries));
            updateUI();
        }

        // WORK SHIFT ENTRY SUBMISSION
        document.getElementById('shift-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const date = document.getElementById('shift-date').value;
            const hours = parseFloat(document.getElementById('shift-hours').value);
            const hourly_rate = parseFloat(document.getElementById('shift-rate').value) || 18.00;
            const job = document.getElementById('shift-job').value.trim() || 'General Work';

            const newShift = {
                id: Date.now().toString(),
                date,
                hours,
                hourly_rate,
                job,
                status: 'logged'
            };

            shiftEntries.unshift(newShift);
            saveShifts();

            document.getElementById('shift-hours').value = '';
            document.getElementById('shift-job').value = '';
        });

        function deleteShift(id) {
            shiftEntries = shiftEntries.filter(s => s.id !== id);
            saveShifts();
        }

        function toggleShiftPaidStatus(id) {
            const shift = shiftEntries.find(s => s.id === id);
            if (shift) {
                shift.status = shift.status === 'paid' ? 'logged' : 'paid';
                saveShifts();
            }
        }

        function updateUI() {
            const taxRate = parseFloat(document.getElementById('tax-rate-input').value) || 0;
            localStorage.setItem(STORAGE_KEY_TAX_RATE, taxRate);

            const totalGross = shiftEntries.reduce((sum, s) => sum + (Number(s.hours) * Number(s.hourly_rate)), 0);
            const totalTax = totalGross * (taxRate / 100);
            const totalNet = Math.max(0, totalGross - totalTax);

            // Update Summary Banner
            document.getElementById('summary-gross').innerText = `$${totalGross.toFixed(2)}`;
            document.getElementById('summary-tax').innerText = `-$${totalTax.toFixed(2)}`;
            document.getElementById('summary-net').innerText = `$${totalNet.toFixed(2)}`;

            document.getElementById('pending-earnings-total').innerText = `$${totalGross.toFixed(2)} Gross`;

            // Render Shift List
            const shiftsListEl = document.getElementById('shifts-list');
            if (shiftEntries.length === 0) {
                shiftsListEl.innerHTML = `<div class="text-slate-500 text-center py-6 text-xs bg-slate-900 border border-slate-800 rounded-2xl">No work shifts logged yet.</div>`;
            } else {
                shiftsListEl.innerHTML = shiftEntries.map(s => {
                    const gross = (Number(s.hours) * Number(s.hourly_rate));
                    const shiftTax = gross * (taxRate / 100);
                    const shiftNet = gross - shiftTax;
                    const isPaid = s.status === 'paid';

                    return `
                        <div class="bg-slate-900 border border-slate-800 p-3 rounded-xl flex items-center justify-between text-xs">
                            <div class="space-y-0.5">
                                <div class="font-bold text-white">${s.date} • ${s.job}</div>
                                <div class="text-[10px] text-slate-400">
                                    ${s.hours} hrs @ $${Number(s.hourly_rate).toFixed(2)}/hr • 
                                    Gross: <span class="text-white font-medium">$${gross.toFixed(2)}</span> | 
                                    Est. Net: <span class="text-emerald-400 font-semibold">$${shiftNet.toFixed(2)}</span>
                                </div>
                            </div>
                            <div class="flex items-center gap-2">
                                <button onclick="toggleShiftPaidStatus('${s.id}')" class="${isPaid ? 'bg-emerald-600/20 text-emerald-400 border-emerald-500/30' : 'bg-slate-800 text-slate-400 border-slate-700'} border font-bold px-2 py-1 rounded-lg transition text-[10px]">
                                    ${isPaid ? 'Credited' : 'Pending'}
                                </button>
                                <button onclick="deleteShift('${s.id}')" class="text-slate-500 hover:text-rose-400 transition p-1">
                                    <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                                </button>
                            </div>
                        </div>
                    `;
                }).join('');
            }

            lucide.createIcons();
        }
    </script>
</body>
</html>
